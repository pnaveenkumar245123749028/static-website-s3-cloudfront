      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentP1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bgP1)"/>
  <!-- Decorative Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 68h600 M0 136h600 M0 204h600 M0 272h600"/>
    <path d="M120 0v340 M240 0v340 M360 0v340 M480 0v340"/>
  </g>
  <!-- Cloud Front Glowing Circles -->
  <circle cx="300" cy="150" r="80" fill="#6366f1" opacity="0.15" filter="blur(20px)"/>
  <circle cx="210" cy="150" r="38" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="210" y="155" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Route 53</text>
  <circle cx="300" cy="150" r="48" fill="#1e293b" stroke="#818cf8" stroke-width="2.5"/>
  <text x="300" y="155" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">CloudFront</text>
  <circle cx="390" cy="150" r="38" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="390" y="155" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">S3 + OAC</text>

  <!-- Connectors -->
  <path d="M248 150h14 M348 150h14" stroke="url(#accentP1)" stroke-width="2"/>

